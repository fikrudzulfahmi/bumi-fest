name: Deploy (cPanel)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fresh:
        description: 'migrate:fresh + seed (instalasi pertama / pemulihan)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build assets
        env:
          VITE_APP_NAME: 'Bumi Fest'
        run: |
          npm ci
          npm run build
          echo "::notice title=MANIFEST::bytes=$(wc -c < public/build/manifest.json) entries=$(grep -c '\"file\"' public/build/manifest.json) assets=$(ls public/build/assets | wc -l)"

      # Normalisasi + validasi SSH key, lalu uji konektivitas. Gagal cepat
      # dengan annotation yang jelas (tanpa perlu akses log admin).
      - name: Pre-flight SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash .github/scripts/prepare_ssh.sh

      - name: Upload built assets (public/build)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/public/build'"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            -r public/build "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/public/"

      - name: Deploy backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FRESH: ${{ github.event.inputs.fresh }}
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/deploy_backend.sh

      - name: Diagnostics (if failed)
        if: failure()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set +e
          PORT="${SSH_PORT:-22}"
          echo "::warning title=P1 HOST::[${SSH_HOST:-KOSONG}] USER=[${SSH_USER:-KOSONG}] PATH=[${DEPLOY_PATH:-KOSONG}]"
          if [ -f ~/.ssh/deploy_key ]; then
            OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' 2>/dev/null && { pwd; ls -a | tr '\n' ' '; php -v 2>&1 | head -1; [ -f artisan ] && echo ARTISAN_ADA || echo ARTISAN_TIDAK; [ -f .env ] && echo ENV_ADA || echo ENV_TIDAK; grep -qE '^APP_KEY=base64:.+' .env 2>/dev/null && echo APPKEY_OK || echo APPKEY_KOSONG; command -v composer || echo COMPOSER_TIDAK; }" 2>&1)
            echo "::warning title=P2 SERVER::$(printf '%s' "$OUT" | tr '\n' ' ' | head -c 600)"
          fi
          exit 0
